<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HelpDesk Assistant</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --text: #1d2330;
            --muted: #5d6675;
            --border: #d5d9e0;
            --accent: #2563eb;
            --error: #b42318;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #14171c;
                --panel: #1d2128;
                --text: #e6e9ef;
                --muted: #9aa3b2;
                --border: #323945;
                --accent: #6ea8fe;
                --error: #ff8a80;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
        h1 { font-size: 1.5rem; margin: 0 0 16px; }
        form { display: flex; gap: 8px; }
        textarea {
            flex: 1;
            min-height: 56px;
            padding: 10px;
            font: inherit;
            color: inherit;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            resize: vertical;
        }
        button {
            padding: 0 18px;
            font: inherit;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: default; }
        .status { color: var(--muted); min-height: 1.4em; margin: 12px 0; }
        .status.error { color: var(--error); }
        .answer {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .sources { margin-top: 16px; }
        .sources h2 { font-size: 1rem; margin: 0 0 8px; }
        details {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        summary { cursor: pointer; overflow-wrap: anywhere; }
        .source-text { color: var(--muted); line-height: 1.5; margin: 8px 0 0; }
        @media (max-width: 520px) {
            form { flex-direction: column; }
            button { padding: 10px; }
        }
    </style>
</head>
<body>
<main>
    <h1>HelpDesk Assistant</h1>
    <form id="ask-form">
        <textarea id="question" rows="2" placeholder="Ask about leave, VPN, expenses..." required></textarea>
        <button id="ask-button" type="submit">Ask</button>
    </form>
    <p id="status" class="status" role="status"></p>
    <section id="result" hidden>
        <div id="answer" class="answer"></div>
        <div class="sources">
            <h2>Sources</h2>
            <div id="sources"></div>
        </div>
    </section>
</main>
<script>
    const form = document.getElementById('ask-form');
    const questionInput = document.getElementById('question');
    const askButton = document.getElementById('ask-button');
    const statusLine = document.getElementById('status');
    const result = document.getElementById('result');
    const answerBox = document.getElementById('answer');
    const sourcesBox = document.getElementById('sources');

    questionInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
        }
    });

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const question = questionInput.value.trim();
        if (!question) {
            showError('Please type a question.');
            return;
        }

        askButton.disabled = true;
        result.hidden = true;
        showStatus('Thinking... this can take about a minute on a local model.');
        try {
            const response = await fetch('/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            if (response.status === 400) {
                showError('Please type a question.');
                return;
            }
            if (!response.ok) {
                showError(`Something went wrong (HTTP ${response.status}). Please try again.`);
                return;
            }
            render(await response.json());
            showStatus('');
        } catch (error) {
            showError('Could not reach the help desk server. Is it running?');
        } finally {
            askButton.disabled = false;
        }
    });

    function render(data) {
        answerBox.textContent = data.answer;
        sourcesBox.replaceChildren(...data.sources.map((source) => {
            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = `${source.title} (${source.path}), score ${source.score.toFixed(2)}`;
            const text = document.createElement('p');
            text.className = 'source-text';
            text.textContent = source.text;
            details.append(summary, text);
            return details;
        }));
        result.hidden = false;
    }

    function showStatus(message) {
        statusLine.className = 'status';
        statusLine.textContent = message;
    }

    function showError(message) {
        statusLine.className = 'status error';
        statusLine.textContent = message;
    }
</script>
</body>
</html>
